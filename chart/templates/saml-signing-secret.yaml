{{- if .Values.sso.enabled }}
{{- include "opentrack.samlSigning" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.sso.signingSecret }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.key: {{ .Values.sso._signingKey | b64enc | quote }}
  tls.crt: {{ .Values.sso._signingCert | b64enc | quote }}
{{- end }}
