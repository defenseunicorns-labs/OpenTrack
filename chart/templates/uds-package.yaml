apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: opentrack
  namespace: {{ .Release.Namespace }}
spec:
  network:
    serviceMesh:
      mode: ambient
    expose:
      - service: opentrack
        selector:
          app.kubernetes.io/name: opentrack
        host: opentrack
        gateway: tenant
        port: 8090
        description: OpenTrack UI and API
        uptime:
          checks:
            paths: [/healthz]
    allow:
      - direction: Ingress
        remoteGenerated: IntraNamespace
      - direction: Egress
        remoteGenerated: IntraNamespace
      - direction: Egress
        selector:
          app.kubernetes.io/name: opentrack
        remoteNamespace: valkey-opentrack
        remoteSelector:
          app.kubernetes.io/name: valkey
        port: 6379
        description: UDS Data Valkey
      - direction: Egress
        selector:
          app.kubernetes.io/name: opentrack
        remoteNamespace: nats
        remoteSelector:
          app.kubernetes.io/name: nats
        port: 4222
        description: UDS Data NATS
      - direction: Egress
        selector:
          app.kubernetes.io/name: opentrack
        remoteNamespace: postgres
        remoteSelector:
          application: spilo
        port: 5432
        description: UDS Data PostgreSQL backend when enabled
      {{- if .Values.sso.enabled }}
      - direction: Egress
        selector:
          app.kubernetes.io/name: opentrack
        remoteNamespace: keycloak
        remoteSelector:
          app.kubernetes.io/name: keycloak
        port: 8080
        description: Keycloak SAML metadata
      {{- end }}
  {{- if .Values.sso.enabled }}
  sso:
    - name: OpenTrack Login
      clientId: "https://opentrack.{{ .Values.domain }}/api/v1/auth/saml/metadata"
      protocol: saml
      attributes:
        saml.client.signature: "false"
      redirectUris:
        - "https://opentrack.{{ .Values.domain }}/api/v1/auth/saml/acs"
      protocolMappers:
        - name: OpenTrack groups
          protocol: saml
          protocolMapper: saml-group-membership-mapper
          config:
            attribute.name: Role
            full.path: "true"
            single: "true"
  {{- end }}
