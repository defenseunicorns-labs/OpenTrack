{{- if and .Values.sourceAccess.enabled .Values.sourceAccess.multicastRelay.enabled }}
{{- if empty .Values.sourceAccess.multicastRelay.nodeSelector }}
{{- fail "sourceAccess.multicastRelay.nodeSelector must select the node receiving multicast" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentrack-multicast-plan
  namespace: {{ .Release.Namespace }}
data:
  plan.json: "[]"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opentrack-multicast-relay
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentrack-multicast-relay
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opentrack
      app.kubernetes.io/component: multicast-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opentrack
        app.kubernetes.io/component: multicast-relay
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: opentrack-multicast-relay
      automountServiceAccountToken: false
      nodeSelector:
        {{- range $key, $value := .Values.sourceAccess.multicastRelay.nodeSelector }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- with .Values.sourceAccess.multicastRelay.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [multicast-relay]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OT_SOURCE_MULTICAST_PLAN_FILE
              value: /etc/opentrack/multicast/plan.json
            - name: OT_SOURCE_UDP_PORTS
              value: {{ .Values.sourceAccess.udpPorts | toJson | quote }}
          volumeMounts:
            - name: plan
              mountPath: /etc/opentrack/multicast
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: plan
          configMap:
            name: opentrack-multicast-plan
{{- end }}
