domain: uds.dev

image:
  repository: localhost:5000/opentrack
  tag: uds-dev-0.1.9
  pullPolicy: IfNotPresent

replicaCount: 1
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

storage:
  backend: sqlite
  size: 2Gi
  postgres:
    host: pg-cluster.postgres.svc.cluster.local
    port: 5432
    database: opentrack
    credentialsSecret: opentrack.opentrack.pg-cluster.credentials.postgresql.acid.zalan.do
    sslmode: require

# Existing PVC backed by an external file share. Mount it read-only so file
# sources can select paths below /source-files without an OpenTrack rebuild.
fileShare:
  claimName: ""

valkey:
  url: redis://valkey-primary.valkey-opentrack.svc.cluster.local:6379
  host: valkey-primary.valkey-opentrack.svc.cluster.local:6379
  urlSecret: opentrack-valkey-url
  passwordSecret: opentrack-valkey-password
  passwordKey: password

nats:
  url: tls://nats.nats.svc.cluster.local:4222
  tlsFirst: true
  caConfigMap: nats-ca-bundle
  caKey: ca.crt
  # Optional explicit PEM. At install time the chart copies the NATS package's
  # CA ConfigMap into this namespace when this is empty.
  caPem: ""

sso:
  enabled: true
  signingSecret: opentrack-saml-signing
  metadataUrl: http://keycloak-http.keycloak.svc.cluster.local:8080/realms/uds/protocol/saml/descriptor
  publicOrigin: ""
  adminGroup: /C-UAS/OpenTrack Admin

auth:
  # Optional bootstrap Secret with email and password keys. Once an account
  # exists, OpenTrack ignores these values.
  bootstrapSecret: opentrack-bootstrap-admin

siteCode: OTK

# Optional runtime access reconciliation. Approval entries are exact host,
# port, protocol tuples; edit the ConfigMap to approve new destinations.
sourceAccess:
  enabled: false
  # Reserve these ports on the Istio tenant gateway LoadBalancer up front.
  tcpPorts: []
  # Preprovision UDP Services on these ports. Envoy Gateway must be installed.
  udpPorts: []
  multicastRelay:
    enabled: false
    nodeSelector: {}
    # Exact CIDR of the selected node's receiving interface, e.g. 192.0.2.10/32.
    nodeCidr: ""
    tolerations: []
  approvals:
    # One-time site choice: saved source requirements receive exact rules
    # within the reserved listener pools without per-source ConfigMap edits.
    auto: false
    hosts: []
    # Plain TCP/MQTT requires an exact source host and a bounded destination CIDR.
    tcp: []
    udp_ports: []
    tcp_ingress_ports: []
    multicast: []
