name: release

# A published GitHub release resolves the already-tested multi-platform CI
# image, signs its index digest, and only then promotes the version tag.
# Signing remains mandatory. See docs/security/supply-chain.md.
#
# The signature goes to no public transparency log:
# .github/cosign/signing-config.json names none. Verify with the
# committed public key, cosign.pub.

on:
  release:
    types: [published]
  # Re-run for an existing release (the workflow as on this branch).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose successful CI image should be signed (e.g. v1.0.0)
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/defenseunicorns-labs/opentrack
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Resolve metadata with the workflow's helper, including manual
          # reruns whose release source predates the helper.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require the upstream repository and release signing configuration
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: |
          if [[ "${GITHUB_REPOSITORY,,}" != "defenseunicorns-labs/opentrack" ]]; then
            echo "Release publication is restricted to the OpenTrack repository" >&2
            exit 1
          fi
          if [[ -z "$RELEASE_SIGNING_KEY" || -z "$RELEASE_SIGNING_PASSWORD" ]]; then
            echo "Configure RELEASE_SIGNING_KEY and RELEASE_SIGNING_PASSWORD; unsigned releases are not permitted" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          path: release-source
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and verify the already-built multi-platform CI image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          revision="$(git -C release-source rev-parse HEAD)"
          python3 scripts/ci/images.py release-candidate --revision "$revision" \
            --tag "$TAG" --output release-candidate.json
      # v4: the installer that knows cosign 3.x (payload and attach only; the
      # signature is made by the OpenSSL FIPS provider, scripts/release/sign-image).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign (OpenSSL FIPS provider)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: |
          ref="$(python3 -c 'import json; print(json.load(open("release-candidate.json"))["reference"])')"
          key_dir="$(mktemp -d "$RUNNER_TEMP/opentrack-signing.XXXXXX")"
          trap 'rm -f "$key_dir/key.pem" "$key_dir/key.pass"; rmdir "$key_dir"' EXIT
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key_dir/key.pem"
          printf '%s' "$RELEASE_SIGNING_PASSWORD" > "$key_dir/key.pass"
          cd release-source
          OT_SIGNING_KEY="$key_dir/key.pem" OT_SIGNING_KEY_PASSWORD_FILE="$key_dir/key.pass" \
            scripts/release/sign-image "$ref"
      - name: Promote the version tag only after signature verification
        run: |
          ref="$(python3 -c 'import json; print(json.load(open("release-candidate.json"))["reference"])')"
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$ref"
          printf '%s\n' "$ref" > image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest
          path: image-digest.txt
          overwrite: true

  sbom:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-fund
        working-directory: ui
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - run: cargo install --locked cargo-cyclonedx
      - run: scripts/security/sbom.py target/sbom
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-digest
          path: target/sbom
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" target/sbom/* --clobber
